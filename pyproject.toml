[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
# Preserve the original notebook lessons and widget exercise as learning material.
extend-exclude = ["*.ipynb", "streamlit_intro.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
